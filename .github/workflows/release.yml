name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v (e.g. 1.0 or 1.0.1)"
        required: true
        default: "1.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build package and create release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Expected a version such as 1.0 or 1.0.1."
            exit 1
          fi

          python scripts/build.py
          package="dist/HeatHaze-ESPless-${version}.zip"
          mv dist/HeatHaze-ESPless.zip "$package"

          gh release create "v${version}" "$package" \
            --target "$GITHUB_SHA" \
            --title "Heat Haze ESPless ${version}" \
            --generate-notes
